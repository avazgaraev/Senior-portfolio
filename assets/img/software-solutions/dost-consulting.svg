  </g>
  <g fill="#702f3c">
    <circle cx="175" cy="151" r="4"/>
    <circle cx="277" cy="100" r="4"/>
    <circle cx="210" cy="319" r="4"/>
    <circle cx="392" cy="265" r="4"/>
