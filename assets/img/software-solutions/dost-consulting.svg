  <g font-family="Arial, sans-serif" font-size="9" fill="#554b42" letter-spacing=".8">
    <text x="150" y="136">EUROPE</text>
    <text x="410" y="269">DUBAI</text>
    <text x="286" y="91">NEW PERSPECTIVES</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" fill="#702f3c" letter-spacing="2">
    <text x="28" y="34">DOST / BUSINESS COMPASS</text>
