    </pattern>
    <linearGradient id="atlas-paper" x2="0" y2="1">
      <stop stop-color="#f6f4ee"/>
      <stop offset="1" stop-color="#e9e5da"/>
    </linearGradient>
  </defs>
  <rect width="600" height="440" fill="url(#atlas-paper)"/>
  <rect width="600" height="440" fill="url(#atlas-grid)" opacity=".82"/>
  <g fill="none" stroke="#b1a797" stroke-width=".8">
    <ellipse cx="300" cy="220" rx="225" ry="170"/>
    <ellipse cx="300" cy="220" rx="140" ry="170"/>
    <ellipse cx="300" cy="220" rx="55" ry="170"/>
    <ellipse cx="300" cy="220" rx="225" ry="65"/>
    <path d="M75 220H525M300 50V390"/>
