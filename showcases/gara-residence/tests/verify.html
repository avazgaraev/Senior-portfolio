<!doctype html><html><head><meta charset="utf-8"><title>Gara QA</title><style>body{font:14px monospace;background:#f5f3ed;color:#30362c}iframe{width:1440px;height:950px;border:0;position:fixed;top:0;left:0;z-index:-1}pre{white-space:pre-wrap;background:#f5f3edf0;padding:25px}</style></head><body><pre id="report">Running verification...</pre><iframe id="frame"></iframe><script>
const results=[],errors=[],frame=document.querySelector('iframe');
const assert=(condition,label)=>{results.push({pass:!!condition,label});document.querySelector('#report').textContent=results.map(x=>(x.pass?'PASS ':'FAIL ')+x.label).join('\n');if(!condition)console.error(label)};
const pause=()=>new Promise(r=>setTimeout(r,100));
async function load(page,width=1440){frame.style.width=width+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src='../'+page});await pause();const w=frame.contentWindow,d=w.document;w.addEventListener('error',e=>errors.push(page+': '+e.message));return {w,d,$:s=>d.querySelector(s),$$:s=>[...d.querySelectorAll(s)]};}
function set(ctx,s,v){const el=ctx.$(s);el.value=v;el.dispatchEvent(new ctx.w.Event('input',{bubbles:true}));el.dispatchEvent(new ctx.w.Event('change',{bubbles:true}));}
function click(ctx,s){const el=ctx.$(s);if(typeof el.click==='function')el.click();else el.dispatchEvent(new ctx.w.MouseEvent('click',{bubbles:true}));}
async function run(){
 let c;
 for(const p of ['index','residences','apartment','amenities','location','progress','about','contact']){
  c=await load(p+'.html');assert(!!c.$('h1'),p+' renders main title');assert(!!c.$('.site-footer'),p+' completes initialization');assert(c.d.documentElement.scrollWidth<=1441,p+' desktop has no horizontal overflow');assert(!/Ã|â€|â†|Â°|�/.test(c.$('#main').textContent),p+' Unicode clean');
  c.$$('img').forEach(im=>im.loading='eager');await pause();assert(c.$$('img').every(im=>im.complete&&im.naturalWidth>0),p+' all images load');
  frame.style.width='390px';await pause();assert(c.d.documentElement.scrollWidth<=391,p+' mobile has no horizontal overflow');if(p==='contact')assert(c.$('.contact-flow').getBoundingClientRect().bottom<=c.$('.contact-layout').getBoundingClientRect().bottom,'Mobile consultation stays above footer');if(p==='location')assert(c.$('.neighbourhood').getBoundingClientRect().bottom<=c.$('.location-layout').getBoundingClientRect().bottom,'Mobile neighbourhood stays inside its section');
 }
 c=await load('index.html');assert(c.w.GARA.apartments.length===120,'Inventory has 120 units');assert(c.w.GARA.counts(c.w.GARA.apartments).map(x=>x.count).join(',')==='42,12,66','Availability totals consistent');set(c,'#floor-select','18');assert(c.$('#selected-floor').textContent==='18','Floor dropdown changes selected floor');click(c,'[data-tower="B"]');assert(c.$('#selected-tower').textContent==='B'&&c.$('#floor-units a').getAttribute('href').includes('B-18'),'Tower switches floor records');click(c,'.floor-hit[data-floor="7"]');assert(c.$('#selected-floor').textContent==='7','Building floor click works');set(c,'#height-slider','18');assert(c.$('#view-title').textContent==='Panoramic view','Height simulator updates perspective');set(c,'#day-slider','100');assert(c.$('.day-night').style.getPropertyValue('--night')==='1','Night lighting responds to slider');
 c=await load('residences.html');assert(c.$$('#residence-results .residence-row').length===12,'Inventory pagination starts at 12');set(c,'#filters [name="bedrooms"]','4');set(c,'#filters [name="status"]','Available');let expected=c.w.GARA.apartments.filter(a=>a.bedrooms===4&&a.status==='Available').length;assert(c.$('#results-count').textContent.startsWith(expected+' '),'Combined filters match source records');click(c,'[data-mode="stack"]');assert(c.$$('#stack-results a.stack-unit').length===expected,'Stack uses filtered dataset');click(c,'#filters [type="reset"]');await pause();click(c,'[data-mode="list"]');click(c,'#load-more');assert(c.$$('#residence-results .residence-row').length===24,'Load more reveals next records');set(c,'#calc-price','245000');set(c,'#calc-down','30');set(c,'#calc-months','24');assert(c.$('#calc-initial').textContent==='73,500 AZN','Down payment calculation correct');assert(c.$('#calc-monthly').textContent.includes('7,146'),'Monthly payment correct');set(c,'#calc-price','-10');assert(c.$('#calc-monthly').textContent==='—','Invalid prices do not calculate');
 c=await load('apartment.html?id=A-12A');assert(c.$('h1').textContent.includes('12A'),'Apartment query selects correct record');assert(c.$('.apartment-price strong').textContent.includes('245,000'),'Apartment price matches inventory');click(c,'.plan-room');assert(c.$('#room-readout').textContent.includes('Living & dining'),'Interactive room plan reports area');click(c,'#expand-plan');assert(c.$('#plan-dialog').open,'Plan dialog opens');click(c,'[data-close-dialog]');assert(!c.$('#plan-dialog').open,'Plan dialog closes');
 for(const id of ['A-12C','A-12B','B-18D']){c=await load('apartment.html?id='+id);const a=c.w.GARA.apartments.find(x=>x.id===id);assert(c.$$('#main-plan .plan-room').length===a.bedrooms+4,'Plan supports '+a.bedrooms+' bedrooms');}
 c=await load('apartment.html?id=bad-id');assert(c.$('h1').textContent.includes('direction'),'Unknown residence handled');
 c=await load('amenities.html');click(c,'[data-amenity="2"]');assert(c.$('#amenity-title').textContent==='A room for good company.','Masterplan hotspot updates amenity');click(c,'#amenity-next');assert(c.$('#amenity-counter').textContent==='04 / 08','Amenity sequence works');click(c,'[data-material="1"]');assert(c.$('#material-visual').classList.contains('oak'),'Material palette swaps');
 c=await load('location.html');click(c,'[data-category="Dining"]');assert(c.$$('.area-marker:not([hidden])').length===1,'Neighbourhood filters markers');click(c,'.area-marker[data-map-category="Dining"]');assert(c.$('#map-selection').textContent.includes('Juniper'),'Map marker opens place details');
 c=await load('progress.html');set(c,'#compare-slider','75');assert(c.$('.comparison').style.getPropertyValue('--split')==='75%','Before/current comparison responds');for(const a of c.$$('.documents a'))assert((await fetch(a.href)).ok,'Document download '+a.getAttribute('href'));
 c=await load('contact.html');for(let step=0;step<5;step++){click(c,'#lead-form [type="submit"]');await pause();}assert(!!c.$('[name="email"]'),'Consultation reaches contact step');set(c,'[name="name"]','Demo Buyer');set(c,'[name="phone"]','+994500000000');set(c,'[name="email"]','demo@example.com');click(c,'[name="acknowledge"]');click(c,'#lead-form [type="submit"]');assert(!!c.$('.request-summary'),'Consultation validates and builds summary');assert(c.$('.request-summary').textContent.includes('demo@example.com'),'Summary contains entered details');click(c,'#edit-request');assert(!!c.$('.choice-grid'),'Summary edit returns to preferences');
 c=await load('contact.html?mode=viewing&unit=A-12A');const viewingDate=c.$('[name="date"]').min;set(c,'[name="date"]',viewingDate);click(c,'#lead-form [type="submit"]');set(c,'[name="name"]','Viewing Demo');set(c,'[name="phone"]','+994501111111');set(c,'[name="email"]','view@example.com');click(c,'[name="acknowledge"]');click(c,'#lead-form [type="submit"]');assert(!!c.$('.request-summary'),'Viewing request completes');assert(c.$('.request-summary').textContent.includes(viewingDate),'Viewing summary contains chosen date');assert(c.$('.request-summary').textContent.includes('12A'),'Viewing retains residence context');
 c=await load('index.html',390);click(c,'.menu-toggle');assert(!c.$('#mobile-nav').hidden,'Mobile menu opens');click(c,'.menu-toggle');assert(c.$('#mobile-nav').hidden,'Mobile menu closes');
 assert(errors.length===0,'No caught runtime errors: '+errors.join('; '));
 document.querySelector('#report').textContent='COMPLETE: '+results.filter(x=>x.pass).length+' PASS / '+results.filter(x=>!x.pass).length+' FAIL\n\n'+results.map(x=>(x.pass?'PASS ':'FAIL ')+x.label).join('\n');document.title='QA COMPLETE';
}
run().catch(e=>{document.querySelector('#report').textContent=JSON.stringify({fatal:e.stack,results},null,2);document.title='QA FAILED'});
</script></body></html>
